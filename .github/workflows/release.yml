name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Gate — the tag only ships when the repository is green
        run: |
          npm run validate
          npm test

      - name: Build checksum manifest
        run: node scripts/checksums.mjs > "CHECKSUMS-${GITHUB_REF_NAME}.txt"

      - name: Verify the manifest before publishing
        run: node scripts/checksums.mjs --verify "CHECKSUMS-${GITHUB_REF_NAME}.txt"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "CHECKSUMS-${GITHUB_REF_NAME}.txt" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "CHECKSUMS-${GITHUB_REF_NAME}.txt" --generate-notes --title "${GITHUB_REF_NAME}"
          fi
