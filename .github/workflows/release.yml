name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build checksum manifest
        run: node scripts/checksums.mjs > "CHECKSUMS-${GITHUB_REF_NAME}.txt"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "CHECKSUMS-${GITHUB_REF_NAME}.txt" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "CHECKSUMS-${GITHUB_REF_NAME}.txt" --generate-notes --title "${GITHUB_REF_NAME}"
          fi
